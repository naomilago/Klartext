services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8010:8010"
    env_file:
      - ./backend/.env
    volumes:
      - klartext_data:/data
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5174:5173"
    depends_on:
      - backend
    restart: always

volumes:
  klartext_data:
